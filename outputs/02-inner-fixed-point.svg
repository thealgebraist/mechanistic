<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc">
  <title id="title">Step 2 - Inner fixed-point partition refinement</title><desc id="desc">A coarse state block is repeatedly split by output and successor signatures until stable.</desc>
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#375a7f"/></marker><style>text{font-family:Inter,Arial,sans-serif;fill:#17212b}.t{font-size:30px;font-weight:700}.s{font-size:18px}.m{font-size:15px;fill:#435466}.line{stroke:#375a7f;stroke-width:3;fill:none;marker-end:url(#a)}.b{stroke:#375a7f;stroke-width:2}.n{fill:#e7f2ff}.g{fill:#edf8ee}.o{fill:#fff1dc}.p{fill:#f4eafa}</style></defs><rect width="1200" height="680" fill="#fff"/>
  <text x="60" y="62" class="t">2. Inner fixed point: split until transition-stable</text>
  <rect x="65" y="180" width="220" height="290" rx="22" class="b n"/><text x="175" y="220" text-anchor="middle" class="s">Coarse block C</text>
  <circle cx="125" cy="285" r="22" fill="#2774ae"/><circle cx="225" cy="285" r="22" fill="#2774ae"/><circle cx="125" cy="380" r="22" fill="#2774ae"/><circle cx="225" cy="380" r="22" fill="#2774ae"/><text x="175" y="440" text-anchor="middle" class="m">states currently merged</text>
  <path d="M285 325H400" class="line"/><text x="342" y="300" text-anchor="middle" class="m">signature</text>
  <rect x="405" y="150" width="310" height="350" rx="20" class="b o"/><text x="560" y="195" text-anchor="middle" class="s">Sig_P(h)</text><text x="560" y="245" text-anchor="middle" class="m">output distribution</text><text x="560" y="285" text-anchor="middle" class="m">+</text><text x="560" y="325" text-anchor="middle" class="m">token-conditioned successors</text><text x="560" y="365" text-anchor="middle" class="m">+</text><text x="560" y="405" text-anchor="middle" class="m">current child block IDs</text><text x="560" y="455" text-anchor="middle" class="m">split when TV or routing differs</text>
  <path d="M715 325H825" class="line"/>
  <rect x="830" y="135" width="300" height="380" rx="20" class="b g"/><text x="980" y="180" text-anchor="middle" class="s">Stable partition R_A(P) = P</text>
  <rect x="875" y="225" width="90" height="105" rx="13" class="b n"/><circle cx="920" cy="275" r="17" fill="#2774ae"/><text x="920" y="315" text-anchor="middle" class="m">type q1</text>
  <rect x="995" y="225" width="90" height="105" rx="13" class="b p"/><circle cx="1040" cy="275" r="17" fill="#8b55a5"/><text x="1040" y="315" text-anchor="middle" class="m">type q2</text>
  <rect x="935" y="370" width="90" height="105" rx="13" class="b o"/><circle cx="980" cy="420" r="17" fill="#c47819"/><text x="980" y="460" text-anchor="middle" class="m">type q3</text>
  <path d="M980 515C980 585 560 585 560 500" class="line"/><text x="770" y="615" text-anchor="middle" class="m">repeat only if a signature changes; finite acyclic trace reaches a fixed point bottom-up</text>
</svg>
