<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
  <title id="title">Step 4 - Coarse-to-fine quotient tower</title><desc id="desc">Four nested quotient graphs refine from 216 to 224 states while error decreases to zero and forgetful maps recover coarser levels.</desc>
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#375a7f"/></marker><style>text{font-family:Inter,Arial,sans-serif;fill:#17212b}.t{font-size:30px;font-weight:700}.s{font-size:18px}.m{font-size:15px;fill:#435466}.map{stroke:#375a7f;stroke-width:3;fill:none;marker-end:url(#a)}.q0{fill:#f4eafa;stroke:#8b55a5;stroke-width:2}.q1{fill:#e7f2ff;stroke:#2774ae;stroke-width:2}.q2{fill:#fff1dc;stroke:#c47819;stroke-width:2}.q3{fill:#edf8ee;stroke:#3c8c4d;stroke-width:2}</style></defs><rect width="1200" height="700" fill="#fff"/>
  <text x="60" y="62" class="t">4. Outer fixed point: nested approximation tower</text>
  <rect x="70" y="210" width="215" height="260" rx="20" class="q0"/><text x="178" y="255" text-anchor="middle" class="s">Q₀</text><text x="178" y="300" text-anchor="middle" class="m">ε = 0.10</text><text x="178" y="345" text-anchor="middle" class="s">216 states</text><text x="178" y="395" text-anchor="middle" class="m">bound 0.270497</text>
  <rect x="350" y="185" width="215" height="310" rx="20" class="q1"/><text x="458" y="235" text-anchor="middle" class="s">Q₁</text><text x="458" y="285" text-anchor="middle" class="m">ε = 0.05</text><text x="458" y="340" text-anchor="middle" class="s">221 states</text><text x="458" y="395" text-anchor="middle" class="m">bound 0.068574</text><text x="458" y="450" text-anchor="middle" class="m">5 split witnesses</text>
  <rect x="630" y="160" width="215" height="360" rx="20" class="q2"/><text x="738" y="215" text-anchor="middle" class="s">Q₂</text><text x="738" y="270" text-anchor="middle" class="m">ε = 0.02</text><text x="738" y="335" text-anchor="middle" class="s">222 states</text><text x="738" y="400" text-anchor="middle" class="m">bound 0.012497</text><text x="738" y="465" text-anchor="middle" class="m">1 split witness</text>
  <rect x="910" y="130" width="215" height="420" rx="20" class="q3"/><text x="1018" y="190" text-anchor="middle" class="s">Q₃ exact</text><text x="1018" y="250" text-anchor="middle" class="m">ε = 0</text><text x="1018" y="325" text-anchor="middle" class="s">224 states</text><text x="1018" y="400" text-anchor="middle" class="m">bound 0</text><text x="1018" y="475" text-anchor="middle" class="m">2 split witnesses</text>
  <path d="M350 570H285" class="map"/><path d="M630 570H565" class="map"/><path d="M910 570H845" class="map"/><text x="318" y="610" text-anchor="middle" class="m">π₀</text><text x="598" y="610" text-anchor="middle" class="m">π₁</text><text x="878" y="610" text-anchor="middle" class="m">π₂</text>
  <text x="600" y="655" text-anchor="middle" class="m">Each π forgets detail; roots and every token transition commute through the map.</text>
</svg>
