<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc">
  <title id="title">Step 3 - Counterexample-guided refinement</title><desc id="desc">Two states in one quotient block are separated by a verified output or continuation witness.</desc>
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#375a7f"/></marker><style>text{font-family:Inter,Arial,sans-serif;fill:#17212b}.t{font-size:30px;font-weight:700}.s{font-size:18px}.m{font-size:15px;fill:#435466}.line{stroke:#375a7f;stroke-width:3;fill:none;marker-end:url(#a)}.box{fill:#f5f8fb;stroke:#375a7f;stroke-width:2}.warn{fill:#fff1dc;stroke:#c47819;stroke-width:2}.ok{fill:#edf8ee;stroke:#3c8c4d;stroke-width:2}</style></defs><rect width="1200" height="680" fill="#fff"/>
  <text x="60" y="62" class="t">3. Counterexample-guided split</text>
  <rect x="60" y="165" width="290" height="350" rx="20" class="box"/><text x="205" y="210" text-anchor="middle" class="s">Current type q</text><circle cx="145" cy="310" r="35" fill="#2774ae"/><circle cx="265" cy="310" r="35" fill="#2774ae"/><text x="145" y="316" text-anchor="middle" fill="#fff" class="s">h</text><text x="265" y="316" text-anchor="middle" fill="#fff" class="s">h′</text><text x="205" y="410" text-anchor="middle" class="m">currently treated as equivalent</text>
  <path d="M350 340H450" class="line"/>
  <rect x="455" y="140" width="300" height="400" rx="20" class="warn"/><text x="605" y="185" text-anchor="middle" class="s">Verified witness</text><text x="605" y="240" text-anchor="middle" class="m">suffix s = a1 ... an</text><path d="M515 290H695" stroke="#c47819" stroke-width="5"/><circle cx="535" cy="290" r="12" fill="#c47819"/><circle cx="605" cy="290" r="12" fill="#c47819"/><circle cx="675" cy="290" r="12" fill="#c47819"/><text x="605" y="350" text-anchor="middle" class="m">TV(p(.|hs), p(.|h's)) &gt; epsilon</text><text x="605" y="405" text-anchor="middle" class="m">or successor type differs</text><text x="605" y="470" text-anchor="middle" class="m">store states, suffix, metric, hash</text>
  <path d="M755 340H855" class="line"/>
  <rect x="860" y="140" width="275" height="175" rx="18" class="ok"/><text x="998" y="185" text-anchor="middle" class="s">Refined type q1</text><circle cx="998" cy="245" r="32" fill="#2774ae"/><text x="998" y="251" text-anchor="middle" fill="#fff" class="s">h</text>
  <rect x="860" y="365" width="275" height="175" rx="18" class="ok"/><text x="998" y="410" text-anchor="middle" class="s">Refined type q2</text><circle cx="998" cy="470" r="32" fill="#8b55a5"/><text x="998" y="476" text-anchor="middle" fill="#fff" class="s">h'</text>
  <text x="60" y="625" class="m">A failed search is not a proof; only a checked witness causes a certified split.</text>
</svg>
