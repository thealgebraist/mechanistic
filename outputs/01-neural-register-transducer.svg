<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc">
  <title id="title">Step 1 - FLAN-T5 as a probabilistic register transducer</title>
  <desc id="desc">Tokens enter typed tensor registers, pass through encoder and cached decoder opcodes, then softmax emits a token distribution.</desc>
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#375a7f"/></marker><style>text{font-family:Inter,Arial,sans-serif;fill:#17212b}.t{font-size:30px;font-weight:700}.s{font-size:18px}.m{font-size:15px;fill:#435466}.box{fill:#f5f8fb;stroke:#375a7f;stroke-width:2}.reg{fill:#e7f2ff;stroke:#2774ae;stroke-width:2}.prob{fill:#edf8ee;stroke:#3c8c4d;stroke-width:2}.line{stroke:#375a7f;stroke-width:3;fill:none;marker-end:url(#a)}</style></defs>
  <rect width="1200" height="680" fill="#ffffff"/>
  <text x="60" y="62" class="t">1. Neural model → typed probabilistic register machine</text>
  <rect x="55" y="260" width="150" height="100" rx="14" class="box"/><text x="130" y="300" text-anchor="middle" class="s">Input tokens</text><text x="130" y="330" text-anchor="middle" class="m">SentencePiece IDs</text>
  <path d="M205 310H275" class="line"/>
  <rect x="280" y="155" width="240" height="310" rx="18" class="reg"/><text x="400" y="195" text-anchor="middle" class="s">Typed registers</text>
  <text x="315" y="240" class="m">E : Matrix[L, 512]</text><text x="315" y="278" class="m">H : Vector[512]</text><text x="315" y="316" class="m">Kℓ : Tensor[6,L,64]</text><text x="315" y="354" class="m">Vℓ : Tensor[6,L,64]</text><text x="315" y="392" class="m">fuel : Nat ≤ horizon</text><text x="315" y="430" class="m">stack : List Token</text>
  <path d="M520 310H590" class="line"/>
  <rect x="595" y="120" width="260" height="380" rx="18" class="box"/><text x="725" y="160" text-anchor="middle" class="s">Deterministic opcodes</text>
  <text x="635" y="210" class="m">RMSNorm</text><text x="635" y="250" class="m">MatMul(Q,K,V,O)</text><text x="635" y="290" class="m">RelativeBias</text><text x="635" y="330" class="m">CausalAttention</text><text x="635" y="370" class="m">GatedGELU</text><text x="635" y="410" class="m">CacheAppend</text><text x="635" y="450" class="m">Readout</text>
  <path d="M855 310H925" class="line"/>
  <rect x="930" y="220" width="215" height="180" rx="18" class="prob"/><text x="1038" y="265" text-anchor="middle" class="s">Probabilistic layer</text><text x="1038" y="310" text-anchor="middle" class="m">p = softmax(logits)</text><text x="1038" y="350" text-anchor="middle" class="m">sample token a</text>
  <path d="M1038 400V550H400V466" class="line"/><text x="720" y="580" text-anchor="middle" class="m">sampled token updates stack and KV cache</text>
  <text x="60" y="640" class="m">Validated checkpoint: 8 encoder layers, 8 decoder layers, 129 symbolic opcodes, 32,128-token vocabulary.</text>
</svg>
