<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
  <title id="title">Step 5 - Certified graph growth and neural residual shrinkage</title><desc id="desc">Verified behavioral patches transfer from a neural residual to an explicit graph while the hybrid evaluator remains invariant.</desc>
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#375a7f"/></marker><style>text{font-family:Inter,Arial,sans-serif;fill:#17212b}.t{font-size:30px;font-weight:700}.s{font-size:18px}.m{font-size:15px;fill:#435466}.line{stroke:#375a7f;stroke-width:3;fill:none;marker-end:url(#a)}.neural{fill:#f4eafa;stroke:#8b55a5;stroke-width:2}.graph{fill:#edf8ee;stroke:#3c8c4d;stroke-width:2}.cert{fill:#fff1dc;stroke:#c47819;stroke-width:2}</style></defs><rect width="1200" height="700" fill="#fff"/>
  <text x="60" y="62" class="t">5. Dual fixed point: graph grows, neural residual shrinks</text>
  <text x="100" y="125" class="s">Stage k</text><rect x="80" y="160" width="440" height="330" rx="24" class="neural"/><text x="300" y="205" text-anchor="middle" class="s">Neural residual R_k</text><rect x="130" y="260" width="150" height="150" rx="16" fill="#e7d7ef" stroke="#8b55a5"/><text x="205" y="335" text-anchor="middle" class="m">candidate patch</text><text x="330" y="340" class="m">untransferred behavior</text>
  <rect x="680" y="160" width="440" height="330" rx="24" class="graph"/><text x="900" y="205" text-anchor="middle" class="s">Explicit graph G_k</text><circle cx="800" cy="330" r="42" fill="#3c8c4d"/><circle cx="1000" cy="330" r="42" fill="#3c8c4d"/><path d="M842 330H958" class="line"/><text x="900" y="305" text-anchor="middle" class="m">token rule</text>
  <path d="M280 335H680" class="line"/><rect x="405" y="275" width="160" height="120" rx="14" class="cert"/><text x="485" y="315" text-anchor="middle" class="s">VERIFY</text><text x="485" y="350" text-anchor="middle" class="m">edge obligations</text><text x="485" y="375" text-anchor="middle" class="m">+ hash</text>
  <text x="600" y="565" text-anchor="middle" class="s">Hybrid invariant</text><text x="600" y="610" text-anchor="middle" class="m">M_k(h,a) = original FLAN behavior T(h,a) on every certified domain point</text><text x="600" y="650" text-anchor="middle" class="m">accepted patch: graph coverage grows; neural residual shrinks</text>
</svg>
