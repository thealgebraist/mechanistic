<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
  <title id="title">Step 6 - Edge-level proof package</title><desc id="desc">A graph edge is accepted only with source coverage, token soundness, output contract, transition closure, routing exclusivity, successor coverage, and hashes.</desc>
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#375a7f"/></marker><style>text{font-family:Inter,Arial,sans-serif;fill:#17212b}.t{font-size:30px;font-weight:700}.s{font-size:18px}.m{font-size:15px;fill:#435466}.line{stroke:#375a7f;stroke-width:3;fill:none;marker-end:url(#a)}.node{fill:#e7f2ff;stroke:#2774ae;stroke-width:2}.proof{fill:#f5f8fb;stroke:#375a7f;stroke-width:2}.hash{fill:#edf8ee;stroke:#3c8c4d;stroke-width:2}</style></defs><rect width="1200" height="700" fill="#fff"/>
  <text x="60" y="62" class="t">6. Every explicit edge carries its proof package</text>
  <circle cx="170" cy="280" r="70" class="node"/><text x="170" y="287" text-anchor="middle" class="s">source q</text><circle cx="1030" cy="280" r="70" class="node"/><text x="1030" y="287" text-anchor="middle" class="s">target q′</text><path d="M240 280H960" class="line"/><text x="600" y="245" text-anchor="middle" class="s">token predicate A / output rule o</text>
  <rect x="320" y="330" width="560" height="260" rx="20" class="proof"/><text x="600" y="370" text-anchor="middle" class="s">Minimal obligations</text>
  <text x="355" y="415" class="m">1. source coverage γ(q) ⊆ reachable states</text><text x="355" y="450" class="m">2. token predicate soundness A ⊆ vocabulary</text><text x="355" y="485" class="m">3. output uniformity or explicit TV interval</text><text x="355" y="520" class="m">4. transition closure into γ(q′)</text><text x="355" y="555" class="m">5. routing exclusivity + successor coverage</text>
  <rect x="900" y="450" width="245" height="140" rx="16" class="hash"/><text x="1022" y="495" text-anchor="middle" class="s">Certificate hash</text><text x="1022" y="530" text-anchor="middle" class="m">model + rule</text><text x="1022" y="558" text-anchor="middle" class="m">assumptions + verifier</text>
  <text x="60" y="650" class="m">The certificate is scoped to the serialized oracle, precision, horizon, checkpoint hash, and verifier semantics.</text>
</svg>
