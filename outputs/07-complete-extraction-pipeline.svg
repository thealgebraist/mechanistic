<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="780" viewBox="0 0 1400 780" role="img" aria-labelledby="title desc">
  <title id="title">Complete FLAN-T5 probabilistic graph extraction pipeline</title><desc id="desc">End-to-end sequence from checkpoint through register semantics, finite reachability, quotient refinement, verification, inverse tower, and graph or residual outcome.</desc>
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#375a7f"/></marker><style>text{font-family:Inter,Arial,sans-serif;fill:#17212b}.t{font-size:30px;font-weight:700}.s{font-size:17px}.m{font-size:14px;fill:#435466}.line{stroke:#375a7f;stroke-width:3;fill:none;marker-end:url(#a)}.b{fill:#f5f8fb;stroke:#375a7f;stroke-width:2}.n{fill:#e7f2ff;stroke:#2774ae;stroke-width:2}.g{fill:#edf8ee;stroke:#3c8c4d;stroke-width:2}.o{fill:#fff1dc;stroke:#c47819;stroke-width:2}.p{fill:#f4eafa;stroke:#8b55a5;stroke-width:2}</style></defs><rect width="1400" height="780" fill="#fff"/>
  <text x="55" y="58" class="t">Certified FLAN-T5 → probabilistic register graph</text>
  <rect x="45" y="135" width="170" height="120" rx="16" class="p"/><text x="130" y="180" text-anchor="middle" class="s">FLAN checkpoint</text><text x="130" y="215" text-anchor="middle" class="m">weights + tokenizer</text>
  <path d="M215 195H270" class="line"/>
  <rect x="275" y="115" width="190" height="160" rx="16" class="n"/><text x="370" y="158" text-anchor="middle" class="s">Register DSL</text><text x="370" y="195" text-anchor="middle" class="m">129 opcodes</text><text x="370" y="225" text-anchor="middle" class="m">KV cache + softmax</text>
  <path d="M465 195H520" class="line"/>
  <rect x="525" y="115" width="190" height="160" rx="16" class="b"/><text x="620" y="158" text-anchor="middle" class="s">Reachability contract</text><text x="620" y="195" text-anchor="middle" class="m">32 prompts</text><text x="620" y="225" text-anchor="middle" class="m">horizon 3</text>
  <path d="M715 195H770" class="line"/>
  <rect x="775" y="115" width="190" height="160" rx="16" class="o"/><text x="870" y="158" text-anchor="middle" class="s">Inner fixed point</text><text x="870" y="195" text-anchor="middle" class="m">output + successor</text><text x="870" y="225" text-anchor="middle" class="m">signatures</text>
  <path d="M965 195H1020" class="line"/>
  <rect x="1025" y="115" width="190" height="160" rx="16" class="g"/><text x="1120" y="158" text-anchor="middle" class="s">VERIFY</text><text x="1120" y="195" text-anchor="middle" class="m">TV + commutation</text><text x="1120" y="225" text-anchor="middle" class="m">hashes + witnesses</text>
  <path d="M1215 195H1280V370H1160" class="line"/>
  <rect x="850" y="325" width="310" height="160" rx="18" class="n"/><text x="1005" y="370" text-anchor="middle" class="s">Outer quotient tower</text><text x="1005" y="410" text-anchor="middle" class="m">216 → 221 → 222 → 224</text><text x="1005" y="445" text-anchor="middle" class="m">π₀, π₁, π₂ forgetful maps</text>
  <path d="M850 405H760" class="line"/>
  <rect x="450" y="325" width="310" height="160" rx="18" class="o"/><text x="605" y="370" text-anchor="middle" class="s">Counterexample?</text><text x="605" y="410" text-anchor="middle" class="m">verified split witness</text><text x="605" y="445" text-anchor="middle" class="m">refine predicates / token classes</text>
  <path d="M605 325V295H870V275" class="line"/>
  <path d="M1005 485V555" class="line"/>
  <rect x="755" y="560" width="500" height="145" rx="20" class="g"/><text x="1005" y="605" text-anchor="middle" class="s">Certified finite-domain graph</text><text x="1005" y="642" text-anchor="middle" class="m">224 exact states at ε=0; binary and JSON proof package</text><text x="1005" y="675" text-anchor="middle" class="m">neural residual = 0 inside the finite contract</text>
  <rect x="145" y="560" width="430" height="145" rx="20" class="p"/><text x="360" y="605" text-anchor="middle" class="s">Explicit residual outside contract</text><text x="360" y="642" text-anchor="middle" class="m">unexplored prompts / longer horizons</text><text x="360" y="675" text-anchor="middle" class="m">route to neural oracle; no false exactness claim</text>
  <path d="M755 632H575" class="line"/>
  <text x="700" y="750" text-anchor="middle" class="m">Honest outcome: exact graph on the certified domain + precisely delimited neural residual elsewhere.</text>
</svg>
