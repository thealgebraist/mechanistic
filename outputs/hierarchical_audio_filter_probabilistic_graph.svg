<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="930" viewBox="0 0 1500 930" role="img" aria-labelledby="t d">
<title id="t">Hierarchical discrete audio filters inside the Whisper probabilistic graph</title>
<desc id="d">Nested graph templates for DFT, Mel, CAR-FAC, inner hair cells, AGC, quotient probabilities, and the Whisper neural suffix, with typed special edges.</desc>
<rect width="100%" height="100%" fill="#fbfcfe"/><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#536274"/></marker></defs>
<style>text{font-family:Menlo,monospace;fill:#16212c}.title{font-size:20px;font-weight:bold}.h{font-size:14px;font-weight:bold}.s{font-size:11px;fill:#536274}.box{fill:#edf4ff;stroke:#275d9e;stroke-width:1.5}.inner{fill:#fff;stroke:#6d86a8;stroke-width:1}.prob{fill:#ecf8ef;stroke:#287a42;stroke-width:1.5}.edge{fill:none;stroke:#536274;stroke-width:1.6;marker-end:url(#arr)}.delay{stroke-dasharray:7 5}.feedback{stroke:#a45a24;stroke-dasharray:3 4}.param{stroke:#7955a3;stroke-dasharray:1 4}</style>
<text x="28" y="34" class="title">Discrete graph-of-graphs: filters are executable nested nodes</text>
<text x="28" y="57" class="s">All samples, coefficients, states, classes, and tokens have finite types. Templates are shared; instance edges expand them only when required.</text>
<rect class="box" x="30" y="105" width="150" height="90" rx="10"/>
<text x="44" y="129" class="h">PCM stream</text>
<text x="44" y="149" class="s">SampleQ15 = Fin 65536</text>
<rect class="box" x="230" y="88" width="475" height="300" rx="10"/>
<text x="244" y="112" class="h">WhisperWindowFrontend</text>
<text x="244" y="132" class="s">contains 3,001 shared frame instances</text>
<rect class="inner" x="255" y="145" width="125" height="72" rx="10"/>
<text x="269" y="169" class="h">Window taps</text>
<text x="269" y="189" class="s">400 coefficient bits</text>
<rect class="inner" x="405" y="145" width="125" height="72" rx="10"/>
<text x="419" y="169" class="h">DFT detector</text>
<text x="419" y="189" class="s">201 graph instances</text>
<rect class="inner" x="555" y="145" width="125" height="72" rx="10"/>
<text x="569" y="169" class="h">Mel detector</text>
<text x="569" y="189" class="s">80 graph instances</text>
<rect class="inner" x="330" y="260" width="250" height="75" rx="10"/>
<text x="344" y="284" class="h">Log/floor/affine</text>
<text x="344" y="304" class="s">80 finite binary32 channels</text>
<path class="edge" d="M180 150 L230 150"/>
<text x="205.0" y="144.0" text-anchor="middle" class="s">SAMPLE_FLOW</text>
<path class="edge" d="M380 181 L405 181"/>
<path class="edge" d="M530 181 L555 181"/>
<path class="edge" d="M618 217 L530 260"/>
<text x="574.0" y="232.5" text-anchor="middle" class="s">global max after drop-last</text>
<rect class="box" x="230" y="455" width="475" height="330" rx="10"/>
<text x="244" y="479" class="h">CARFACWindowFrontend</text>
<text x="244" y="499" class="s">contains shared sample + frame templates</text>
<rect class="inner" x="255" y="515" width="125" height="72" rx="10"/>
<text x="269" y="539" class="h">CAR section</text>
<text x="269" y="559" class="s">81 place instances</text>
<rect class="inner" x="405" y="515" width="125" height="72" rx="10"/>
<text x="419" y="539" class="h">IHC detector</text>
<text x="419" y="559" class="s">81 state machines</text>
<rect class="inner" x="555" y="515" width="125" height="72" rx="10"/>
<text x="569" y="539" class="h">AGC stage</text>
<text x="569" y="559" class="s">4 x 81 instances</text>
<rect class="inner" x="330" y="665" width="250" height="72" rx="10"/>
<text x="344" y="689" class="h">NAP81 -&gt; quotient</text>
<text x="344" y="709" class="s">81 sections to 80 place sets</text>
<path class="edge" d="M180 150 L230 510"/>
<text x="205.0" y="324.0" text-anchor="middle" class="s">SAMPLE_FLOW</text>
<path class="edge" d="M380 551 L405 551"/>
<path class="edge" d="M530 551 L555 551"/>
<path class="edge feedback" d="M617 587 C617 642 320 642 320 587"/><text x="470" y="637" text-anchor="middle" class="s">AGC feedback</text>
<path class="edge" d="M468 587 L455 665"/>
<rect class="box" x="790" y="120" width="265" height="100" rx="10"/>
<text x="804" y="144" class="h">Coefficient bit blocks</text>
<text x="804" y="164" class="s">15 blocks / 712684 bytes</text>
<path class="edge param" d="M790 170 L705 170"/>
<path class="edge param" d="M790 200 L705 520"/>
<rect class="prob" x="790" y="330" width="265" height="115" rx="10"/>
<text x="804" y="354" class="h">ProbabilityQuotient</text>
<text x="804" y="374" class="s">energy -&gt; mass80 -&gt; Fin16</text>
<path class="edge" d="M705 300 L790 365"/>
<path class="edge" d="M705 700 L790 410"/>
<rect class="box" x="1135" y="300" width="320" height="150" rx="10"/>
<text x="1149" y="324" class="h">Whisper neural suffix</text>
<text x="1149" y="344" class="s">74 op graph / 167 tensor refs</text>
<path class="edge" d="M1055 382 L1135 382"/>
<text x="1095.0" y="376.0" text-anchor="middle" class="s">MODEL_INTERFACE</text>
<rect class="prob" x="1135" y="510" width="320" height="100" rx="10"/>
<text x="1149" y="534" class="h">Token law</text>
<text x="1149" y="554" class="s">Categorical over Fin 51864</text>
<path class="edge" d="M1295 450 L1295 510"/>
<text x="1295.0" y="474.0" text-anchor="middle" class="s">PROBABILITY_NORMALIZE</text>
<text x="790" y="690" class="h">Special edge semantics</text>
<line class="edge" x1="790" y1="725" x2="895" y2="725"/><text x="910" y="729" class="s">ordinary / graph instance</text>
<line class="edge delay" x1="790" y1="760" x2="895" y2="760"/><text x="910" y="764" class="s">state delay t -> t+1</text>
<line class="edge feedback" x1="790" y1="795" x2="895" y2="795"/><text x="910" y="799" class="s">biological feedback</text>
<line class="edge param" x1="790" y1="830" x2="895" y2="830"/><text x="910" y="834" class="s">immutable parameter bits</text>
<text x="28" y="900" class="s">Flat 30 s estimates: Mel 970,232,303 scalar nodes; CAR-FAC 3,188,160,000. Hierarchical templates remain finite and shared.</text>
</svg>
