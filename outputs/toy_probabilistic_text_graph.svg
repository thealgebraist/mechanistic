<svg xmlns="http://www.w3.org/2000/svg" width="1480" height="700" viewBox="0 0 1480 700">
<rect width="100%" height="100%" fill="#fbfcfe"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#526274"/></marker></defs>
<style>text{font-family:Menlo,monospace;fill:#17212b}.edge{fill:none;stroke:#526274;stroke-width:1.7;marker-end:url(#arrow)}.node{fill:#eaf2ff;stroke:#285c9e;stroke-width:2}.merged{fill:#ecf8ef;stroke:#287a42}.small{font-size:11px}.title{font-size:20px;font-weight:bold}.subtitle{font-size:13px;fill:#526274}.edgeLabel{font-size:12px;paint-order:stroke;stroke:#fbfcfe;stroke-width:6px;stroke-linejoin:round}</style>
<text x="30" y="34" class="title">Exact probabilistic quotient of the sample text model</text>
<text x="30" y="58" class="subtitle">7 binary hidden states -&gt; 5 minimal behavioral states; edge label = emitted token / exact probability</text>
<path class="edge" d="M 195 350 Q 275 285 355 220"/>
<text class="edgeLabel" x="275" y="273" text-anchor="middle">key / 8/16</text>
<path class="edge" d="M 195 350 Q 275 415 355 480"/>
<text class="edgeLabel" x="275" y="403" text-anchor="middle">keys / 8/16</text>
<path class="edge" d="M 505 220 Q 640 285 775 350"/>
<text class="edgeLabel" x="640" y="273" text-anchor="middle">is / 14/16</text>
<path class="edge" d="M 505 220 Q 820 70 1185 350"/>
<text class="edgeLabel" x="820" y="88" text-anchor="middle">found,missing / 1/16</text>
<path class="edge" d="M 505 480 Q 640 415 775 350"/>
<text class="edgeLabel" x="640" y="403" text-anchor="middle">are / 14/16</text>
<path class="edge" d="M 505 480 Q 820 630 1185 350"/>
<text class="edgeLabel" x="820" y="622" text-anchor="middle">found,missing / 1/16</text>
<path class="edge" d="M 942 350 Q 1055 288 1168 350"/>
<text class="edgeLabel" x="1055" y="280" text-anchor="middle">found / 10/16</text>
<path class="edge" d="M 942 350 Q 1055 350 1168 350"/>
<text class="edgeLabel" x="1055" y="342" text-anchor="middle">missing / 5/16</text>
<path class="edge" d="M 942 350 Q 1055 412 1168 350"/>
<text class="edgeLabel" x="1055" y="404" text-anchor="middle">. / 1/16</text>
<path class="edge" d="M 1235 292 C 1160 115 1360 115 1285 292"/>
<text class="edgeLabel" x="1260" y="112" text-anchor="middle">. / 16/16</text>
<rect class="node " x="45" y="292" width="150" height="116" rx="16"/>
<text x="120" y="327" text-anchor="middle">q0</text>
<text class="small" x="120" y="352" text-anchor="middle">START</text>
<text class="small" x="120" y="384" text-anchor="middle">singleton</text>
<rect class="node " x="355" y="162" width="150" height="116" rx="16"/>
<text x="430" y="197" text-anchor="middle">q1</text>
<text class="small" x="430" y="222" text-anchor="middle">SINGULAR</text>
<text class="small" x="430" y="254" text-anchor="middle">singleton</text>
<rect class="node " x="355" y="422" width="150" height="116" rx="16"/>
<text x="430" y="457" text-anchor="middle">q2</text>
<text class="small" x="430" y="482" text-anchor="middle">PLURAL</text>
<text class="small" x="430" y="514" text-anchor="middle">singleton</text>
<rect class="node merged" x="745" y="292" width="210" height="116" rx="16"/>
<text x="850" y="327" text-anchor="middle">q3</text>
<text class="small" x="850" y="352" text-anchor="middle">PREDICATE_A / PREDICATE_B</text>
<text class="small" x="850" y="384" text-anchor="middle">nontrivial merge</text>
<rect class="node merged" x="1155" y="292" width="210" height="116" rx="16"/>
<text x="1260" y="327" text-anchor="middle">q4</text>
<text class="small" x="1260" y="352" text-anchor="middle">TERMINAL_A / TERMINAL_B</text>
<text class="small" x="1260" y="384" text-anchor="middle">nontrivial merge</text>
<text x="30" y="652" class="subtitle">Green nodes are nontrivial merges. The equations lambda Q = O and delta_a Q = Q T_a hold exactly in integer mass arithmetic.</text>
<text x="30" y="678" class="subtitle">Example: P(keys are found .) = (8 x 14 x 10 x 16) / 16^4 = 0.2734375.</text>
</svg>
